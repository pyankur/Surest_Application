spring.application.name=Surest_Management_App

# = DATA SOURCE CONFIGURATION

spring.datasource.url=jdbc:postgresql://localhost:5432/surest
spring.datasource.username=postgres
spring.datasource.password=root

# ================================
# HIKARI CONNECTION POOL SETTINGS
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=SurestHikariPool

#  JPA / HIBERNATE CONFIGURATION

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY MIGRATION

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CACHE CONFIGURATION

spring.cache.type=simple

# SERVER CONFIGURATION

server.port=8080

# JWT CONFIGURATION

jwt.secret=change-me-to-a-very-long-secret-in-prod
jwt.expiration-ms=86400000

# LOGGING CONFIGURATION
logging.level.root=INFO
logging.level.com.surest=DEBUG

# MANAGEMENT / ACTUATOR CONFIG

management.endpoints.web.exposure.include=*
